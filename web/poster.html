<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#f4eee4;font-family:Inter,-apple-system,sans-serif;color:#2b2723}
  .poster{position:relative;height:540px;overflow:hidden;border-radius:14px;background:linear-gradient(160deg,#f7f2ea 0%,#ebe1d1 100%)}
  .img{position:absolute;right:-40px;top:20px;width:66%;opacity:0;animation:rise 1.4s .2s ease-out forwards;
       -webkit-mask-image:radial-gradient(ellipse 70% 75% at 55% 50%,#000 60%,transparent 100%)}
  .glow{position:absolute;right:21%;top:46%;width:30%;height:6px;border-radius:6px;background:#ffd9a0;filter:blur(8px);
        opacity:.0;animation:pulse 3.2s 1.6s ease-in-out infinite}
  .copy{position:absolute;left:44px;top:56px;width:40%}
  .brand{letter-spacing:.35em;font-weight:700;font-size:15px;opacity:0;animation:fade .8s .1s forwards}
  h1{font-size:44px;line-height:1.08;margin:26px 0 18px;font-weight:700;opacity:0;animation:fade 1s .6s forwards}
  h1 span{display:block}
  p{font-weight:300;font-size:16px;line-height:1.5;opacity:0;animation:fade 1s 1.1s forwards}
  .box{position:absolute;left:44px;bottom:40px;display:flex;gap:10px;opacity:0;animation:fade 1s 1.6s forwards}
  .tag{border:1px solid #cdbfa8;border-radius:999px;padding:6px 12px;font-size:13px;background:#fffaf2}
  .price{position:absolute;right:36px;bottom:34px;font-size:13px;color:#8a8076;opacity:0;animation:fade 1s 2s forwards}
  .price b{font-size:22px;color:#2b2723}
  @keyframes fade{to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:.15}50%{opacity:.8}}
</style></head>
<body>
<div class="poster">
  <img class="img" src="data:image/jpeg;base64,{{HERO}}" alt="ANCHOR smart feeder (AI generated render)">
  <div class="glow"></div>
  <div class="copy">
    <div class="brand">ANCHOR</div>
    <h1><span>Your Wi-Fi can go down.</span><span style="color:#c9772e">Dinner can't.</span></h1>
    <p>Feeds on schedule with or without the internet.<br>Weighs every meal, so you know your cat actually ate.<br>No subscription. Ever.</p>
  </div>
  <div class="box"><span class="tag">⚡ Works offline</span><span class="tag">⚖️ Weighs every meal</span><span class="tag">∅ No subscription</span></div>
  <div class="price">from <b>$119</b></div>
</div>
</body></html>
